[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shamcash"
version = "1.3.1"
description = "Sync and async Python SDK for shamcash-api.com: account linking, balances, incoming transfers and subscriptions"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [{ name = "Melchersman", email = "api.shamcash@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "shamcash",
    "sham cash",
    "shamcash api",
    "shamcashapi",
    "api sham cash",
    "payment",
    "api",
    "syria",
    "wallet",
]
dependencies = [
    "httpx>=0.27,<1",
    "backports.zoneinfo>=0.2.1; python_version < '3.9'",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
qr = [
    "qrcode[pil]>=7.4,<9",
    "Pillow>=10,<12",
    "cairosvg>=2.7,<3",
]
dev = [
    "httpx>=0.27,<1",
    "qrcode[pil]>=7.4,<9",
    "Pillow>=10,<12",
    "cairosvg>=2.7,<3",
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://shamcash-api.com"
Documentation = "https://shamcash-api.com/en/docs"
"Python guide" = "https://shamcash-api.com/en/python"
"دليل بايثون" = "https://shamcash-api.com/python"
"Payment integration" = "https://shamcash-api.com/en/integration"
Repository = "https://github.com/Melchersman/shamcash"
Issues = "https://github.com/Melchersman/shamcash/issues"
Changelog = "https://github.com/Melchersman/shamcash/releases"

[tool.setuptools]
packages = ["shamcash"]

[tool.setuptools.package-data]
shamcash = ["py.typed", "assets/*.png", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
